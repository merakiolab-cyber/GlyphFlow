<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D14"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070B10"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="accentGrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Rectangle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1.5"/>

  <!-- Matrix Subtle Grid Pattern in Safe Zone -->
  <g opacity="0.18" stroke="#00F2FE" stroke-width="1.5">
    <line x1="128" y1="96" x2="128" y2="416" stroke-dasharray="4,8"/>
    <line x1="256" y1="96" x2="256" y2="416" stroke-dasharray="4,8"/>
    <line x1="384" y1="96" x2="384" y2="416" stroke-dasharray="4,8"/>
    <line x1="96" y1="128" x2="416" y2="128" stroke-dasharray="4,8"/>
    <line x1="96" y1="256" x2="416" y2="256" stroke-dasharray="4,8"/>
    <line x1="96" y1="384" x2="416" y2="384" stroke-dasharray="4,8"/>
  </g>

  <!-- Glowing Glyph Symbol (Omega / Infinity / Typography synthesis) -->
  <g filter="url(#glow)">
    <!-- Central Character Map Monogram: Modern stylized Greek Omega + Character Map matrix -->
    <path d="M 176 348 L 136 348 C 122 348 112 338 112 324 C 112 310 122 300 136 300 C 148 300 170 300 188 286 C 206 272 208 244 208 240 C 208 190 230 148 280 148 C 330 148 352 190 352 240 C 352 244 354 272 372 286 C 390 300 412 300 424 300 C 438 300 448 310 448 324 C 448 338 438 348 424 348 L 384 348" 
          fill="none" stroke="url(#cyanGlow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Central diamond / crystal spark -->
    <polygon points="280,210 298,240 280,270 262,240" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="280" cy="240" r="4" fill="#00F2FE"/>
  </g>

  <!-- Corner Modern Accent Nodes -->
  <circle cx="128" cy="128" r="4" fill="#00F2FE" opacity="0.6"/>
  <circle cx="384" cy="128" r="4" fill="#00F2FE" opacity="0.6"/>
  <circle cx="128" cy="384" r="4" fill="#00F2FE" opacity="0.6"/>
  <circle cx="384" cy="384" r="4" fill="#00F2FE" opacity="0.6"/>
</svg>
