<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlyphFlow - Moderní Mapa Znaků</title>
    <script>
      (function() {
        try {
          const params = new URLSearchParams(window.location.search);
          const urlTheme = params.get('theme');
          const savedTheme = localStorage.getItem('gf_theme');
          const theme = urlTheme || savedTheme || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Profesionální offline mapa znaků s bleskovým vyhledáváním, exportem do SVG/PNG, lokální databází, historií a synchronizací." />
    <meta property="og:title" content="GlyphFlow - Moderní Mapa Znaků" />
    <meta property="og:description" content="Profesionální offline mapa znaků s bleskovým vyhledáváním, exportem do SVG/PNG, lokální databází, historií a synchronizací." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#121214" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GlyphFlow" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body class="bg-zinc-50 text-zinc-900 dark:bg-[#121214] dark:text-zinc-100 antialiased selection:bg-zinc-200 dark:selection:bg-zinc-700 selection:text-zinc-900 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
